services:
  couchdb:
    image: couchdb:3.5
    container_name: obsidian-livesync
    restart: unless-stopped
    ports:
      - "5984:5984"
    environment:
      - COUCHDB_USER=${COUCHDB_USER}
      - COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
      - COUCHDB_SECRET=${COUCHDB_SECRET}
      - TZ=${TZ}
    volumes:
      - ${LIVESYNC_DIR}/data/:/opt/couchdb/data
      - ${LIVESYNC_DIR}/config:/opt/couchdb/etc/local.d
    networks:
      - obsidian-network
    healthcheck:
      # LiveSync sets require_valid_user=true, so even /_up needs auth.
      # $$ defers expansion to the container shell (no password in the compose file).
      test: ["CMD-SHELL", "curl -fs -u \"$${COUCHDB_USER}:$${COUCHDB_PASSWORD}\" http://localhost:5984/_up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  obsidian-network:
    driver: bridge


